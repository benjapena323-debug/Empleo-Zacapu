<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleo Zacapu - Dirección de Desarrollo Económico</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --guinda: #6B1426;
            --guinda-oscuro: #4E0E1B;
            --guinda-claro: #8C2138;
            --dorado: #C2A649;
            --fondo: #F9F9FB;
            --texto: #333333;
            --blanco: #FFFFFF;
            --gris-claro: #E5E5E9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--fondo);
            color: var(--texto);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header institucional */
        header {
            background-color: var(--guinda);
            color: var(--blanco);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-text h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .logo-text p {
            font-size: 0.8rem;
            color: #E0D0D4;
        }

        .admin-btn {
            background-color: transparent;
            border: 2px solid var(--dorado);
            color: var(--blanco);
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-btn:hover {
            background-color: var(--dorado);
            color: var(--guinda-oscuro);
        }

        /* Contenido Principal */
        main {
            max-width: 1200px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero-section h2 {
            font-size: 2rem;
            color: var(--guinda);
            margin-bottom: 10px;
        }

        .hero-section p {
            color: #666;
            font-size: 1.05rem;
        }

        /* Buscador */
        .search-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .search-bar input {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            border: 1px solid var(--gris-claro);
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: border-color 0.3s;
        }

        .search-bar input:focus {
            border-color: var(--guinda);
        }

        /* Grid de Empleos */
        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .job-card {
            background: var(--blanco);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 5px solid var(--guinda);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .job-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(107, 20, 38, 0.1);
        }

        .job-img-container {
            width: 100%;
            height: 160px;
            background-color: #f0f0f0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .job-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .job-content-padding {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .job-title {
            font-size: 1.25rem;
            color: var(--guinda);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .job-company {
            font-size: 0.95rem;
            color: #555;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .job-details {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .job-details span i {
            color: var(--guinda-claro);
            width: 20px;
        }

        .job-desc {
            font-size: 0.9rem;
            color: #444;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .job-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--gris-claro);
            padding-top: 15px;
            margin-top: auto;
            flex-wrap: wrap;
            gap: 10px;
        }

        .job-salary {
            font-weight: 700;
            color: var(--guinda-oscuro);
            font-size: 1.05rem;
        }

        .btn-apply {
            background-color: #25D366;
            color: var(--blanco);
            padding: 8px 14px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        .btn-apply:hover {
            background-color: #1EBE5D;
        }

        /* Modal de Login de Administrador */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: var(--blanco);
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            border-top: 5px solid var(--guinda);
        }

        .modal-box h3 {
            color: var(--guinda);
            margin-bottom: 20px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        /* Panel de Administración */
        .admin-panel {
            display: none;
            background: var(--blanco);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 40px;
            border: 1px solid var(--gris-claro);
        }

        .admin-panel h3 {
            color: var(--guinda);
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--texto);
        }

        .form-group input, .form-group textarea {
            padding: 10px 14px;
            border: 1px solid var(--gris-claro);
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input[type="file"] {
            padding: 7px;
            background: #fafafa;
            cursor: pointer;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--guinda);
        }

        .btn-save {
            background-color: var(--guinda);
            color: var(--blanco);
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-save:hover {
            background-color: var(--guinda-oscuro);
        }

        .admin-actions-cell {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            border-top: 1px dashed var(--gris-claro);
            padding-top: 10px;
        }

        .btn-edit {
            background-color: #f0ad4e;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-delete {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        footer {
            background-color: var(--guinda-oscuro);
            color: var(--blanco);
            text-align: center;
            padding: 20px;
            margin-top: auto;
            font-size: 0.9rem;
        }

        footer p {
            color: #E0D0D4;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #777;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo-area">
                <div class="logo-text">
                    <h1>Empleo Zacapu</h1>
                    <p>Dirección de Desarrollo Económico</p>
                </div>
            </div>
            <button class="admin-btn" id="openModalBtn">
                <i class="fa-solid fa-lock"></i> Acceso Admin
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main>
        <section class="hero-section">
            <h2>Bolsa de Trabajo Municipal</h2>
            <p>Encuentra oportunidades laborales o publica vacantes para tu empresa en Zacapu.</p>
        </section>

        <!-- Buscador -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Buscar por puesto, empresa o palabra clave...">
        </div>

        <!-- Panel de Administración (Oculto por defecto) -->
        <div class="admin-panel" id="adminPanel">
            <h3>
                <span>Panel de Administración de Vacantes</span>
                <div>
                    <button class="btn-edit" id="logoutAdminBtn" style="margin-right: 5px;"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</button>
                    <button class="btn-delete" id="closeAdminBtn"><i class="fa-solid fa-xmark"></i> Ocultar</button>
                </div>
            </h3>
            <form id="jobForm">
                <input type="hidden" id="jobId">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="jobTitleInput">Puesto / Empleo</label>
                        <input type="text" id="jobTitleInput" required placeholder="Ej. Auxiliar Administrativo">
                    </div>
                    <div class="form-group">
                        <label for="jobCompanyInput">Empresa</label>
                        <input type="text" id="jobCompanyInput" required placeholder="Ej. Comercializadora Zacapu">
                    </div>
                    <div class="form-group">
                        <label for="jobLocationInput">Ubicación</label>
                        <input type="text" id="jobLocationInput" required placeholder="Ej. Centro, Zacapu">
                    </div>
                    <div class="form-group">
                        <label for="jobSalaryInput">Salario / Sueldo</label>
                        <input type="text" id="jobSalaryInput" required placeholder="Ej. $8,000 mensuales">
                    </div>
                    <div class="form-group">
                        <label for="jobPhoneInput">WhatsApp de Contacto</label>
                        <input type="text" id="jobPhoneInput" required placeholder="Ej. 4363420000">
                    </div>
                    <div class="form-group">
                        <label for="jobImageInput">Imagen o Logo (Opcional - Máx 1MB)</label>
                        <input type="file" id="jobImageInput" accept="image/*">
                    </div>
                    <div class="form-group full-width">
                        <label for="jobDescInput">Descripción de la Vacante</label>
                        <textarea id="jobDescInput" rows="3" required placeholder="Requisitos, horario y detalles del puesto..."></textarea>
                    </div>
                </div>
                <button type="submit" class="btn-save"><i class="fa-solid fa-save"></i> Guardar Vacante</button>
            </form>
        </div>

        <!-- Grid de Empleos -->
        <div class="jobs-grid" id="jobsGrid">
            <!-- Las vacantes se cargarán dinámicamente aquí -->
        </div>
    </main>

    <!-- Modal de Login de Administrador -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h3><i class="fa-solid fa-lock"></i> Iniciar Sesión</h3>
            <form id="loginForm">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="adminPassword">Contraseña de Administrador</label>
                    <input type="password" id="adminPassword" required placeholder="Ingresa la contraseña">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-delete" id="closeModalBtn">Cancelar</button>
                    <button type="submit" class="btn-save">Ingresar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 H. Ayuntamiento de Zacapu - Dirección de Desarrollo Económico</p>
    </footer>

    <script>
        const PASSWORD_ADMIN = 'Zacapu2026*';

        const openModalBtn = document.getElementById('openModalBtn');
        const loginModal = document.getElementById('loginModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const loginForm = document.getElementById('loginForm');
        const adminPanel = document.getElementById('adminPanel');
        const closeAdminBtn = document.getElementById('closeAdminBtn');
        const logoutAdminBtn = document.getElementById('logoutAdminBtn');
        const jobForm = document.getElementById('jobForm');
        const jobsGrid = document.getElementById('jobsGrid');
        const searchInput = document.getElementById('searchInput');

        let isAdminLoggedIn = false;
        let jobs = [];

        try {
            const savedJobs = localStorage.getItem('zacapu_jobs');
            if (savedJobs) {
                jobs = JSON.parse(savedJobs);
            }
        } catch (error) {
            console.error("Error al cargar localStorage:", error);
            jobs = [];
        }

        // Control del botón principal de acceso
        openModalBtn.addEventListener('click', () => {
            if (isAdminLoggedIn) {
                adminPanel.style.display = adminPanel.style.display === 'block' ? 'none' : 'block';
            } else {
                loginModal.style.display = 'flex';
            }
        });

        closeModalBtn.addEventListener('click', () => {
            loginModal.style.display = 'none';
        });

        closeAdminBtn.addEventListener('click', () => {
            adminPanel.style.display = 'none';
        });

        // Cerrar sesión
        logoutAdminBtn.addEventListener('click', () => {
            isAdminLoggedIn = false;
            adminPanel.style.display = 'none';
            openModalBtn.innerHTML = '<i class="fa-solid fa-lock"></i> Acceso Admin';
            renderJobs();
            alert('Sesión de administrador cerrada correctamente.');
        });

        // Ingresar contraseña en el modal
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const pass = document.getElementById('adminPassword').value;
            
            if(pass === PASSWORD_ADMIN) {
                isAdminLoggedIn = true;
                loginModal.style.display = 'none';
                adminPanel.style.display = 'block';
                document.getElementById('adminPassword').value = '';
                openModalBtn.innerHTML = '<i class="fa-solid fa-unlock"></i> Panel Admin';
                renderJobs();
            } else {
                alert('Contraseña incorrecta');
            }
        });

        // Guardar o Actualizar Vacante (Valida que la sesión esté activa)
        jobForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            if (!isAdminLoggedIn) {
                adminPanel.style.display = 'none';
                loginModal.style.display = 'flex';
                alert('Debe iniciar sesión como administrador para guardar cambios.');
                return;
            }

            const id = document.getElementById('jobId').value;
            const title = document.getElementById('jobTitleInput').value.trim();
            const company = document.getElementById('jobCompanyInput').value.trim();
            const location = document.getElementById('jobLocationInput').value.trim();
            const salary = document.getElementById('jobSalaryInput').value.trim();
            const phone = document.getElementById('jobPhoneInput').value.trim();
            const desc = document.getElementById('jobDescInput').value.trim();
            const imageInput = document.getElementById('jobImageInput');

            const saveJobData = (imageUrl) => {
                try {
                    if (id) {
                        jobs = jobs.map(job => job.id == id ? {
                            ...job, title, company, location, salary, phone, desc, 
                            image: imageUrl !== undefined ? imageUrl : job.image 
                        } : job);
                    } else {
                        const newJob = {
                            id: Date.now(),
                            title, company, location, salary, phone, desc,
                            image: imageUrl || ''
                        };
                        jobs.push(newJob);
                    }

                    localStorage.setItem('zacapu_jobs', JSON.stringify(jobs));
                    jobForm.reset();
                    document.getElementById('jobId').value = '';
                    adminPanel.style.display = 'none';
                    renderJobs();
                    alert('¡Vacante guardada correctamente!');
                } catch (err) {
                    alert('Error al guardar: es posible que la imagen sea demasiado pesada para la memoria del navegador.');
                }
            };

            if (imageInput.files && imageInput.files[0]) {
                const file = imageInput.files[0];
                if (file.size > 1024 * 1024) {
                    alert('La imagen es demasiado pesada. Selecciona una de menos de 1 MB.');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveJobData(e.target.result);
                };
                reader.readAsDataURL(file);
            } else {
                const existingJob = jobs.find(j => j.id == id);
                saveJobData(existingJob ? existingJob.image : '');
            }
        });

        // Renderizar vacantes
        function renderJobs(filterText = '') {
            jobsGrid.innerHTML = '';
            
            const filteredJobs = jobs.filter(job => 
                job.title.toLowerCase().includes(filterText.toLowerCase()) ||
                job.company.toLowerCase().includes(filterText.toLowerCase()) ||
                job.desc.toLowerCase().includes(filterText.toLowerCase())
            );

            if (filteredJobs.length === 0) {
                jobsGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-briefcase fa-3x" style="margin-bottom: 15px; color: var(--dorado);"></i>
                        <p>No hay vacantes registradas o que coincidan con la búsqueda.</p>
                    </div>
                `;
                return;
            }

            filteredJobs.forEach(job => {
                const card = document.createElement('div');
                card.className = 'job-card';
                
                let imageHtml = '';
                if (job.image) {
                    imageHtml = `<div class="job-img-container"><img src="${job.image}" alt="Logo empresa"></div>`;
                }

                card.innerHTML = `
                    ${imageHtml}
                    <div class="job-content-padding">
                        <div>
                            <h3 class="job-title">${job.title}</h3>
                            <div class="job-company"><i class="fa-solid fa-building"></i> ${job.company}</div>
                            <div class="job-details">
                                <span><i class="fa-solid fa-location-dot"></i> ${job.location}</span>
                            </div>
                            <p class="job-desc">${job.desc}</p>
                        </div>
                        <div>
                            <div class="job-footer">
                                <span class="job-salary">${job.salary}</span>
                                <a href="https://wa.me/52${job.phone}?text=Hola,%20me%20interesa%20la%20vacante%20de%20${encodeURIComponent(job.title)}" target="_blank" class="btn-apply">
                                    <i class="fa-brands fa-whatsapp"></i> Postularse
                                </a>
                            </div>
                            ${isAdminLoggedIn ? `
                                <div class="admin-actions-cell">
                                    <button class="btn-edit" onclick="editJob(${job.id})"><i class="fa-solid fa-pen"></i> Editar</button>
                                    <button class="btn-delete" onclick="deleteJob(${job.id})"><i class="fa-solid fa-trash"></i> Eliminar</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
                jobsGrid.appendChild(card);
            });
        }

        window.editJob = function(id) {
            if (!isAdminLoggedIn) {
                loginModal.style.display = 'flex';
                return;
            }
            const job = jobs.find(j => j.id == id);
            if (job) {
                document.getElementById('jobId').value = job.id;
                document.getElementById('jobTitleInput').value = job.title;
                document.getElementById('jobCompanyInput').value = job.company;
                document.getElementById('jobLocationInput').value = job.location;
                document.getElementById('jobSalaryInput').value = job.salary;
                document.getElementById('jobPhoneInput').value = job.phone;
                document.getElementById('jobDescInput').value = job.desc;
                adminPanel.style.display = 'block';
                window.scrollTo({ top: adminPanel.offsetTop - 20, behavior: 'smooth' });
            }
        };

        window.deleteJob = function(id) {
            if (!isAdminLoggedIn) {
                loginModal.style.display = 'flex';
                return;
            }
            if (confirm('¿Estás seguro de eliminar esta vacante?')) {
                jobs = jobs.filter(j => j.id != id);
                try {
                    localStorage.setItem('zacapu_jobs', JSON.stringify(jobs));
                } catch(e) {}
                renderJobs(searchInput.value);
                alert('Vacante eliminada correctamente.');
            }
        };

        searchInput.addEventListener('input', (e) => {
            renderJobs(e.target.value);
        });

        renderJobs();
    </script>
</body>
</html>
